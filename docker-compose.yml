name: mochikata

# docker のログは既定で上限なく増え続ける(ディスクいっぱいの一因になる)ので
# 1 コンテナあたり 10MB × 3 世代までにする。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mochikata-postgres
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tokyo
    # ホスト公開はローカル開発用のみ(127.0.0.1 にバインドして外部から到達不可にする)。
    # リモート/本番運用では POSTGRES_HOST_BIND を設定しないか、ここ全体をコメントアウト。
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: mochikata-web
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - INITIAL_PIN=${INITIAL_PIN}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_BASE=${GOOGLE_OAUTH_REDIRECT_BASE:-http://localhost:3000}
      - JOBS_TOKEN=${JOBS_TOKEN}
      - PUSH_HIDE_PAYLOAD=${PUSH_HIDE_PAYLOAD:-true}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - APP_ORIGIN=${APP_ORIGIN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - TZ=Asia/Tokyo
      # manaba 取得先。CIT 以外の大学で本アプリを動かす場合に上書きする。
      # 未設定なら src/lib/manabaScrape.ts の DEFAULT_BASE が使われる。
      - MANABA_BASE_URL=${MANABA_BASE_URL:-}
      # CITポータルスクレイパーのステップ別デバッグログ。問題切り分け時のみ有効化。
      - CIT_PORTAL_DEBUG=${CIT_PORTAL_DEBUG:-0}
    # 既定は 127.0.0.1 のみ(この Mac からだけ見える)。公開するときは
    # WEB_HOST_BIND="0.0.0.0:3000" などを設定し、APP_ORIGIN も合わせる。
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1:3000}:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: mochikata-worker
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JOBS_TOKEN=${JOBS_TOKEN}
      - PUSH_HIDE_PAYLOAD=${PUSH_HIDE_PAYLOAD:-true}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - WEB_URL=http://web:3000
      - TZ=Asia/Tokyo
      # job の実行結果を残す(コンテナを作り直しても消えない)。
      # 見るとき: docker compose exec worker tail -n 50 /app/logs/jobs.log
      - JOB_LOG_DIR=/app/logs
    volumes:
      - worker_logs:/app/logs

volumes:
  pg_data:
  worker_logs:
