name: CI

# PR ごと + develop / main への push で tsc / lint / vitest を実行する。
# Dockerfile (node:24-alpine) と Node のメジャーを揃える。
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチで連続 push したとき古い run を cancel して節約する。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN は読み取りだけで足りる (デフォルトの書き込み権限を渡さない)。
permissions:
  contents: read

jobs:
  check:
    name: tsc / lint / vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # サプライチェーン対策でアクションはコミット SHA に固定する (タグは付け替え可能なため)。
      # 更新時は SHA と横のバージョンコメントを一緒に書き換える。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続ステップで git push しないので、認証情報をワークスペースに残さない
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Dockerfile に揃える (node:24-alpine)
          node-version: '24'
          # 公式 cache (npm の lockfile が変わったら invalidate)
          cache: 'npm'

      - name: Install dependencies
        # CI では lockfile に厳密に従って再現性を確保する
        run: npm ci

      - name: Generate Prisma client
        # tsc が schema 由来の型を読むので tsc より先に必須
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run
